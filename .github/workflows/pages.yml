# Publishes the app to GitHub Pages at https://<user>.github.io/<repo>/.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # No server here: the AI Coach uses a Gemini key saved in the app's Settings.
          # To use your own coach server instead, set a repository variable COACH_URL
          # (for example https://<site>.netlify.app/api/coach).
          VITE_COACH_URL: ${{ vars.COACH_URL }}
      # Pages has no rewrites: serving the app for unknown paths makes /workout etc. work.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
